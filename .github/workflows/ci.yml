name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-scripts:
    name: Testes dos scripts
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # O teste de sincronização do alvo de testes se pula sem a gem.
      - name: Instala xcodeproj
        run: gem install --user-install xcodeproj

      - name: unittest
        run: python3 -m unittest Scripts/tests/test_scripts.py

  test-papagaio-core:
    name: Testes do PapagaioCore (SPM)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap runtimes (Silero VAD)
        run: ./Scripts/bootstrap-runtimes.sh

      - name: swift test
        run: ./Scripts/testa-papagaio-core.sh

  build-app:
    name: Build do app (Loro.xcodeproj)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap runtimes (Silero VAD)
        run: ./Scripts/bootstrap-runtimes.sh

      - name: Testes isolados do app
        env:
          PAPAGAIO_TEST_MODE: "1"
        run: |
          xcodebuild test \
            -project Loro.xcodeproj \
            -scheme Loro \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /private/tmp/papagaio-ci-app-tests

      - name: xcodebuild build
        run: |
          xcodebuild build \
            -project Loro.xcodeproj \
            -scheme Loro \
            -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
