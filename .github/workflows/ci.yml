name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-papagaio-core:
    name: Testes do PapagaioCore (SPM)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap runtimes (Silero VAD)
        run: ./Scripts/bootstrap-runtimes.sh

      - name: swift test
        working-directory: PapagaioCore
        run: swift test

  build-app:
    name: Build do app (Papagaio.xcodeproj)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap runtimes (Silero VAD)
        run: ./Scripts/bootstrap-runtimes.sh

      # `test`, e não `build`: o alvo PapagaioTests existe desde que o
      # .xcodeproj ganhou um segundo target. Um destino concreto é obrigatório
      # aqui — `generic/platform=macOS` serve para compilar, não para executar.
      - name: xcodebuild test
        run: |
          xcodebuild test \
            -project Papagaio.xcodeproj \
            -scheme Papagaio \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  formatacao:
    name: Formatação
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Bloqueante desde o primeiro dia porque a base já passa limpa: medido
      # com --strict em Papagaio, PapagaioTests e PapagaioCore, zero achados.
      # `--strict` é o que transforma aviso em falha; sem ele o lint sai 0
      # mesmo reclamando.
      - name: swift format lint
        run: |
          swift format lint --strict --recursive --parallel \
            Papagaio PapagaioTests PapagaioCore/Sources PapagaioCore/Tests
